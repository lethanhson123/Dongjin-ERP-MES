	<style>
		/* Giữ nguyên các phần khác */
		input::placeholder {
			font-weight: bold;
			opacity: 1;
			color: #575757;
		}

		/* Container bao ngoài để chồng lớp */
		.slideshow-container {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
			/* Đảm bảo nằm dưới nội dung login */
			overflow: hidden;
		}

		.slide {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-size: cover;
			background-position: center;
			opacity: 0;
			animation: fadeEffect 80s infinite;
		}

		/* Gán ảnh cho từng slide */
		.s1 {
			background-image: url('/image/1.png');
			animation-delay: 0s;
		}

		.s2 {
			background-image: url('/image/2.png');
			animation-delay: 10s;
		}

		.s3 {
			background-image: url('/image/3.png');
			animation-delay: 20s;
		}

		.s4 {
			background-image: url('/image/4.png');
			animation-delay: 30s;
		}

		.s5 {
			background-image: url('/image/5.png');
			animation-delay: 40s;
		}

		.s6 {
			background-image: url('/image/6.png');
			animation-delay: 50s;
		}

		.s7 {
			background-image: url('/image/7.png');
			animation-delay: 60s;
		}

		.s8 {
			background-image: url('/image/8.png');
			animation-delay: 70s;
		}

		@keyframes fadeEffect {
			0% {
				opacity: 0;
			}

			2.5% {
				opacity: 1;
			}
			
			15% {
				opacity: 1;
			}
			
			17.5% {
				opacity: 0;
			}
			
			100% {
				opacity: 0;
			}
		}
	</style>
