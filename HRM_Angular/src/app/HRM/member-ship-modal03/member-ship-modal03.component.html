<div class="row">
    <div class="col s12 m12 l12" style="display: flex; align-items: center; justify-content: space-between;">
        <h6 class="breadcrumbs-title" style="margin: 0;">
            Phòng ban / 부서
            <span *ngIf="CategoryHRMPhongBanService.List">({{CategoryHRMPhongBanService.List.length}} items)</span>
        </h6>
        <button title="Close | 닫다" class="btn waves-effect waves-light purple lighten-1"
            (click)="MembershipListModalClose()">
            <i class="material-icons">close</i>
        </button>
    </div>
    <div class="col s12 m12 l12">
        <div class="card card card-default scrollspy">
            <div class="card-content">
                <div class="col s12 m12 l2">
                    <select class="browser-default form-select" [(ngModel)]="CategoryHRMPhongBanService.BaseParameter.CompanyID"
                        (change)="CategoryHRMPhongBanSearch()">
                        <option *ngFor="let item of CompanyService.ListFilter;" [value]="item.ID">
                            {{item.Name}}
                        </option>
                    </select>
                </div>
                <div class="col s12 m12 l9">
                    <input [(ngModel)]="CategoryHRMPhongBanService.BaseParameter.SearchString" placeholder="Search ..."
                        class="form-control" (keyup.enter)="CategoryHRMPhongBanFilter()">
                </div>
                <div class="col s12 m12 l1">
                    <button title="search" (click)="CategoryHRMPhongBanFilter()" style="width: 100%;"
                        class="btn waves-effect waves-light green darken-1">
                        <i class="material-icons">search</i>
                    </button>
                </div>
                <div class="KhungOverflow70">
                    <table *ngIf="!NotificationService.IsMobile" mat-table matSort #CategoryHRMPhongBanSort="matSort"
                        [dataSource]="CategoryHRMPhongBanService.DataSource">
                        <ng-container matColumnDef="No">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                                No
                            </th>
                            <td mat-cell *matCellDef="let element; index as i;">
                                <div *ngIf="CategoryHRMPhongBanPaginator">
                                    {{
                                    CategoryHRMPhongBanPaginator.pageSize *
                                    CategoryHRMPhongBanPaginator.pageIndex + i + 1
                                    }}
                                </div>
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="ID">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                            <td mat-cell *matCellDef="let element">
                                {{element.ID}}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="Code">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
                            <td mat-cell *matCellDef="let element">
                                <input class="form-control" type="text" placeholder="Code" name="Code{{element.ID}}"
                                    [(ngModel)]="element.Code">
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="Name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>English</th>
                            <td mat-cell *matCellDef="let element">
                                <input class="form-control" type="text" placeholder="Name" name="Name{{element.ID}}"
                                    [(ngModel)]="element.Name">
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="Display">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Korea</th>
                            <td mat-cell *matCellDef="let element">
                                <input class="form-control" type="text" placeholder="Korea"
                                    name="Display{{element.ID}}" [(ngModel)]="element.Display">
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="Description">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Viet Nam</th>
                            <td mat-cell *matCellDef="let element">
                                <input class="form-control" type="text" placeholder="Viet Nam"
                                    name="Description{{element.ID}}" [(ngModel)]="element.Description">
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="SortOrder">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>SortOrder</th>
                            <td mat-cell *matCellDef="let element">
                                <input class="form-control" type="text" placeholder="SortOrder"
                                    name="SortOrder{{element.ID}}" [(ngModel)]="element.SortOrder">
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="Active">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Active
                            </th>
                            <td mat-cell *matCellDef="let element">
                                <label>
                                    <input class="form-check-input" type="checkbox" name="Active{{element.ID}}"
                                        [(ngModel)]="element.Active">
                                    <span></span>
                                </label>
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="Save">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                            </th>
                            <td mat-cell *matCellDef="let element">
                                <button (click)="CategoryHRMPhongBanSave(element)"
                                    class="btn waves-effect waves-light cyan" title="Save">
                                    <i class="material-icons">save</i>
                                </button>
                            </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="CategoryHRMPhongBanService.DisplayColumns001">
                        </tr>
                        <tr mat-row *matRowDef="let row; columns: CategoryHRMPhongBanService.DisplayColumns001;">
                        </tr>
                    </table>
                    <mat-paginator *ngIf="!NotificationService.IsMobile" #CategoryHRMPhongBanPaginator="matPaginator"
                        [pageSizeOptions]="[10,20,50,100]" [pageSize]="10" [showFirstLastButtons]></mat-paginator>
                </div>
            </div>
        </div>
    </div>
</div>
<app-loading *ngIf="CategoryHRMPhongBanService.IsShowLoading"></app-loading>
